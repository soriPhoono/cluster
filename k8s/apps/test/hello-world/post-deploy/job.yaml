apiVersion: batch/v1
kind: Job
metadata:
  name: hello-world-post-deploy
  namespace: flux-system
spec:
  template:
    spec:
      serviceAccountName: flux
      restartPolicy: OnFailure
      containers:
        - name: copy-secret
          image: registry.k8s.io/kubectl:v1.29.0
          command: ["/bin/sh", "/scripts/exec.sh"]
          volumeMounts:
            - name: scripts-volume
              mountPath: /scripts
      volumes:
        - name: scripts-volume
          configMap:
            name: hello-world-post-deploy-sh
            defaultMode: 0755
