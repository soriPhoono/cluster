apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-server
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-server
    spec:
      containers:
        - name: server
          image: netbirdio/netbird-server:latest
          args: ["--config", "/etc/netbird/config.yaml"]
          ports:
            - containerPort: 80
              name: http
            - containerPort: 3478
              name: stun
              protocol: UDP
            - containerPort: 9000
              name: health
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
            - name: data
              mountPath: /var/lib/netbird
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: netbird-server-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-server
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: stun
      port: 3478
      protocol: UDP
      targetPort: stun
    - name: health
      port: 9000
      targetPort: health
