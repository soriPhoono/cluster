apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-server-config
  namespace: netbird
data:
  config.yaml: |
    server:
      listenAddress: ":80"
      exposedAddress: "https://vpn.cryptic-coders.net"
      stunPorts: [3478]
      healthcheckAddress: ":9000"
      authSecret: "nb-relay-secret-change-in-production"
      logLevel: "info"
      dataDir: "/var/lib/netbird"
      auth:
        # Embedded IdP for initial login; add Authentik as external OIDC
        # provider via Dashboard UI after first login.
        localAuthDisabled: false
        issuer: "https://vpn.cryptic-coders.net/oauth2"
        signKeyRefreshEnabled: true
        dashboardRedirectURIs:
          - "https://vpn.cryptic-coders.net/nb-auth"
          - "https://vpn.cryptic-coders.net/nb-silent-auth"
        cliRedirectURIs:
          - "http://localhost:53000/"
        owner:
          email: "admin@cryptic-coders.net"
          password: "changeme123"
      store:
        engine: "sqlite"
