# Cloudflare Tunnel connects directly to the authentik-server service.
# No Traefik proxy needed — Cloudflare handles TLS termination.
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: guenivir-authentik-binding
  namespace: authentik
subjects:
  - name: authentik-server
    spec:
      fqdn: "auth.cryptic-coders.net"
      target: http://authentik-server.authentik.svc.cluster.local:80
tunnelRef:
  kind: Tunnel
  name: guenivir-authentik-tunnel
