apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/components/network/traefik
  prune: true
  wait: true
