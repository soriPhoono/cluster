apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-tier1
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  dependsOn:
    - name: cert-manager
      namespace: flux-system
    - name: cloudflare-operator
      namespace: flux-system
    - name: cloudnative-pg
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./k3s/apps/manifests/authentik
  prune: true
  wait: true
