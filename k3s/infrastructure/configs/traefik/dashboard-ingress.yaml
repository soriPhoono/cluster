# Tailscale proxies HTTPS (443) to the traefik Service over HTTP; Traefik serves /dashboard via
# its bundled IngressRoute on the web entrypoint. Requires HTTPS + MagicDNS on the tailnet.
# https://tailscale.com/docs/features/kubernetes-operator/how-to/cluster-ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - guenivir-traefik-dashboard
  rules:
    - http:
        paths:
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
