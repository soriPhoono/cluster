apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  releaseName: cilium
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cilium
      version: 1.19.3
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  values:
    ipam:
      mode: kubernetes
    routingMode: tunnel
    kubeProxyReplacement: "false"
    enableLBIPAM: true
    defaultLBServiceIPAM: lbipam
    bgpControlPlane:
      enabled: true
