apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.traefik.io/traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: docker.io/traefik
      tag: v3.3.4
    deployment:
      replicas: 1
      kind: Deployment
    globalArguments:
      - "--global.sendanonymoususage=false"
    logs:
      general:
        format: json
      access:
        enabled: true
        format: json
    ports:
      web:
        port: 80
        expose: true
        exposedPort: 80
      websecure:
        port: 443
        expose: true
        exposedPort: 443
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
    service:
      type: LoadBalancer
    persistence:
      enabled: false
    affinity: {}
    topologySpreadConstraints: []
