# Routes fqdn traffic to Traefik `web` via cloudflared. subjects[].name must be
# an existing Service in this namespace.
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: guenivir-tunnel-binding
subjects:
  - kind: Service
    name: guenivir-demo-app
    spec:
      fqdn: demo.cryptic-coders.net
      protocol: http
      target: http://traefik.traefik.svc.cluster.local:80
tunnelRef:
  kind: ClusterTunnel
  name: guenivir-tunnel
