apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vmstack
  namespace: observability
spec:
  replicaCount: 1
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
