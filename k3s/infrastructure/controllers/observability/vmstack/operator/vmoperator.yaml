apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 1h
  url: https://victoriametrics.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  interval: 1h
  timeout: 15m
  releaseName: victoria-metrics-operator
  targetNamespace: observability
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 12h
  values:
    nameOverride: vmo
    admissionWebhooks:
      enabled: true
      certManager:
        enabled: true
