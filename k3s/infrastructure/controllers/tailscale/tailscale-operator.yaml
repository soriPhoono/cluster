# If the operator crash-loops on auth, allow tag:guenivir-node in ACL tagOwners and on the OAuth
# client. Proxies still default to tag:k8s unless you override proxyConfig.defaultTags.
# https://tailscale.com/kb/1236/kubernetes-operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: tailscale
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tailscale-operator
      version: 1.96.5
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: tailscale-oauth
      valuesKey: clientId
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-oauth
      valuesKey: clientSecret
      targetPath: oauth.clientSecret
  values:
    installCRDs: true
    operatorConfig:
      logging: info
      defaultTags:
        - "tag:guenivir-node"
