# Tailscale operator tags must match the OAuth client tag in Admin (Trust credentials):
# create/replace the OAuth client with tag tag:guenivir-operator — not tag:k8s-operator — or API
# auth keys fail with "requested tags .. are invalid or not permitted".
#
# ACL tagOwners (minimal example — extend hosts/grants as needed):
#   "tagOwners": {
#     "tag:guenivir-operator": [],
#     "tag:guenivir-node": ["tag:guenivir-operator"]
#   }
#
# proxyConfig.defaultTags must be a comma-separated string (not a YAML list).
# Ephemeral tailnet devices are not configurable in tailscale-operator chart 1.96.x; upstream has not
# shipped stable Helm flags for operator/proxy ephemeral registration — see tailscale/tailscale#10166.
# Proxy StatefulSets remove their tailnet device when the workload is deleted; the operator device persists.
# https://tailscale.com/kb/1236/kubernetes-operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: tailscale
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tailscale-operator
      version: 1.96.5
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: tailscale-oauth
      valuesKey: clientId
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-oauth
      valuesKey: clientSecret
      targetPath: oauth.clientSecret
  values:
    installCRDs: true
    operatorConfig:
      hostname: guenivir-operator
      logging: info
      defaultTags:
        - "tag:guenivir-operator"
    proxyConfig:
      defaultTags: "tag:guenivir-node"
    apiServerProxyConfig:
      mode: true
