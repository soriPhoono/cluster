# Requires cluster GitRepository `flux-system` (Flux bootstrap) pointing at this repo.
# Install cert-manager before this HelmRelease (operator webhooks need TLS Certificates).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: cloudflare-operator-system
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: charts/cloudflare-operator
      sourceRef:
        kind: HelmRepository
        name: personal
        namespace: flux-system
      interval: 12h
  values:
    installCRDs: true
    certManager:
      enabled: true
    metricsService:
      enabled: true
