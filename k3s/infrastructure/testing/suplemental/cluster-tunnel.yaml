apiVersion: networking.cfargotunnel.com/v1alpha2
kind: ClusterTunnel
metadata:
  name: guenivir-testing-tunnel # The ClusterTunnel Custom Resource Name
spec:
  newTunnel:
    name: guenivir-testing-tunnel # Name of your new tunnel on Cloudflare
  cloudflare:
    email: soriphoono@gmail.com # Your email used to login to the Cloudflare Dashboard
    domain: cryptic-coders.net # Domain under which the tunnel runs and adds DNS entries to
    secret: cloudflare-secrets # The secret created before
    # accountId and accountName cannot be both empty. If both are provided, Account ID is used if valid, else falls back to Account Name.
    accountId: b6e9a277e1c46db22032d0e2c04fb6ae
    accountName: homelab
---
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: hello-world-tunnel-binding
  namespace: hello-world
subjects:
  - name: wildcard
    spec:
      fqdn: "*.cryptic-coders.net"
      # IngressRoute uses `web` (:80); :443/`websecure` has no matching route.
      target: http://traefik.traefik.svc.cluster.local:80
tunnelRef:
  kind: ClusterTunnel
  name: guenivir-testing-tunnel
