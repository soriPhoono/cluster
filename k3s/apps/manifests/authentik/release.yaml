apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  releaseName: authentik
  targetNamespace: authentik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: 2026.2.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  values:
    authentik:
      existingSecret:
        secretName: authentik-env
    postgresql:
      enabled: false
    server:
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      env:
        - name: AUTHENTIK_HTTP__PROXY_HEADERS__SCHEME
          value: "X-Forwarded-Proto"
        - name: AUTHENTIK_HTTP__SECURE_PROXY_SSL_HEADER
          value: "X-Forwarded-Proto,https"
        - name: AUTHENTIK_CSRF_TRUSTED_ORIGINS
          value: "https://auth.cryptic-coders.net,http://auth.cryptic-coders.net"
    worker:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      env:
        - name: AUTHENTIK_HTTP__PROXY_HEADERS__SCHEME
          value: "X-Forwarded-Proto"
        - name: AUTHENTIK_HTTP__SECURE_PROXY_SSL_HEADER
          value: "X-Forwarded-Proto,https"
        - name: AUTHENTIK_CSRF_TRUSTED_ORIGINS
          value: "https://auth.cryptic-coders.net,http://auth.cryptic-coders.net"
