apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  releaseName: authentik
  targetNamespace: authentik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: 2026.2.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  values:
    authentik:
      existingSecret:
        secretName: authentik-env
    postgresql:
      enabled: false
    server:
      ingress:
        enabled: false
      route:
        main:
          enabled: true
          hostnames:
            - auth.cryptic-coders.net
          parentRefs:
            - name: authentik-gateway
              namespace: authentik
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      # Environment variables for authentik server (Cloudflare Tunnel)
      env:
        # DON'T set USE_X_FORWARDED_HOST - it conflicts with Envoy proxy
        # Let Django use the standard Host header which is correctly forwarded
        - name: AUTHENTIK_HTTP__PROXY_HEADERS__SCHEME
          value: "X-Forwarded-Proto"
        - name: AUTHENTIK_HTTP__SECURE_PROXY_SSL_HEADER
          value: "X-Forwarded-Proto,https"
        - name: AUTHENTIK_CSRF_TRUSTED_ORIGINS
          value: "https://auth.cryptic-coders.net,http://auth.cryptic-coders.net"
        - name: AUTHENTIK_SESSION_COOKIE_SECURE
          value: "true"
        - name: AUTHENTIK_CSRF_COOKIE_SECURE
          value: "true"
    worker:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      # Environment variables for authentik worker (Cloudflare Tunnel)
      env:
        - name: AUTHENTIK_HTTP__PROXY_HEADERS__SCHEME
          value: "X-Forwarded-Proto"
        - name: AUTHENTIK_HTTP__SECURE_PROXY_SSL_HEADER
          value: "X-Forwarded-Proto,https"
        - name: AUTHENTIK_CSRF_TRUSTED_ORIGINS
          value: "https://auth.cryptic-coders.net,http://auth.cryptic-coders.net"
        - name: AUTHENTIK_SESSION_COOKIE_SECURE
          value: "true"
        - name: AUTHENTIK_CSRF_COOKIE_SECURE
          value: "true"
