apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-world
  namespace: hello-world
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`hello-world.cryptic-coders.net`)
      services:
        - name: hello-world
          port: 80
---
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: hello-world-tunnel-binding
  namespace: hello-world
subjects:
  - name: wildcard
    spec:
      fqdn: "*.cryptic-coders.net"
      target: https://traefik.traefik.svc.cluster.local:443
tunnelRef:
  kind: ClusterTunnel
  name: guenivir-testing-tunnel
