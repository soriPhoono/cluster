# Sends tunnel traffic to Traefik `web` (HTTP). subjects[].name must be an existing Service in this namespace.
# Use a concrete fqdn (matches IngressRoute Host()); *.zone wildcards often hit TXT/DNS validation errors in the operator.
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: nginx-hello
  namespace: nginx-hello
spec:
  tunnelRef:
    kind: Tunnel
    name: nginx-hello
  subjects:
    - name: nginx-hello
      spec:
        fqdn: demo.cryptic-coders.net
        target: traefik.traefik.svc.cluster.local:443
