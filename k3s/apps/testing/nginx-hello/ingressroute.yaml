# Replace demo.example.com with the hostname you create in Cloudflare DNS (same value as TunnelBinding.spec.subjects[].spec.fqdn).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-hello
  namespace: testing
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`demo.cryptic-coders.net`)
      services:
        - name: nginx-hello
          port: 80
